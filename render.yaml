services:
  # Single Unified Web Service (FastAPI + Embedded React SPA on Render)
  - type: web
    name: is-assist-portal
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false # Must be set manually in Render Dashboard for security
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: TOP_K
        value: "5"
      - key: MAX_UPLOAD_MB
        value: "10"
